<!doctype html>
<!-- Source for background.tiff (620x400pt). Regenerate after edits (see
     scratchpad shoot script / release notes):
       playwright screenshots at deviceScaleFactor 1 and 2, then
       tiffutil -cathidpicheck bg1x.png bg2x.png -out background.tiff

     LIGHT surface by design, not preference: Finder draws icon labels in
     dark text over background pictures and exposes NO label-color control
     (dmgbuild settings spec; create-dmg #197) — a dark floor makes the
     app/Applications labels near-invisible. Light is also Apple's own DMG
     material. Tokens from the design system's light column.

     SAFE ZONE: window bounds include the ~28pt title bar, and a user can
     have BOTH the path bar and status bar enabled (~82pt total chrome), so
     the worst-case canvas is ~318pt. Every glyph ends by y=303; the canvas
     is 560pt tall so resizes reveal floor, never a white seam. -->
<html lang="en">
<meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  html,body { width:620px; height:560px; overflow:hidden; }
  body { background:#F5F5F7; color:#1D1D1F;
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing:antialiased; position:relative; }
  header { position:absolute; top:24px; left:26px; right:26px;
    display:flex; align-items:center; gap:10px;
    padding-bottom:12px; border-bottom:1px solid rgba(0,0,0,.11); }
  header img { width:22px; height:22px; border-radius:5px; }
  /* Three sizes, clean steps (18 → 14 → 11): the drag instruction is the
     hero, the wordmark a quiet anchor, support lines share 11px. */
  header .name { font-size:14px; font-weight:700; letter-spacing:-.01em; }
  header .eyebrow { margin-left:auto; font-size:11px; font-weight:700;
    letter-spacing:.07em; color:#59595E; }
  /* Icon wells: create-dmg pins the real icons at centers 160/460, y156,
     128pt — nothing is drawn there, Finder's black labels land below on
     this light floor at full contrast. */
  .arrow { position:absolute; top:162px; left:250px; width:120px; height:12px; }
  .drag { position:absolute; top:264px; left:0; right:0; text-align:center;
    font-size:18px; font-weight:650; color:#1D1D1F; }
  .tag { position:absolute; top:292px; left:0; right:0; text-align:center;
    font-size:11px; color:#59595E; }
</style>
<body>
  <header>
    <img src="mark.png" alt="">
    <span class="name">llmpilot</span>
    <span class="eyebrow">YOUR ACCOUNTS, ON AUTOPILOT</span>
  </header>
  <svg class="arrow" viewBox="0 0 120 12" fill="none" aria-hidden="true">
    <path d="M2 6 H112 M104 1.5 L112 6 L104 10.5" stroke="#59595E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="drag">drag llmpilot to Applications</div>
  <div class="tag">signed &amp; notarized · free core · one-time Pro</div>
</body>
</html>
