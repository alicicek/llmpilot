name: codeql

# CodeQL static analysis (SAST) for the Go core and the TS/JS surfaces
# (site, worker, embedded cockpit). Runs on PRs, push to main, and weekly.
#
# build-mode: none — CodeQL extracts and analyzes without compiling, so it
# never trips the `pnpm build` -> go:embed ordering the real app build needs,
# and needs no ../llmpilot-pro sibling. Hosted ubuntu (1x).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2" # Tuesdays 06:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: "/language:${{ matrix.language }}"
