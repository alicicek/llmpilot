name: codeql

# CodeQL static analysis (SAST) for the Go core and the TS/JS surfaces
# (site, worker, cockpit). On PRs, push to main, and weekly; security-extended
# query suite.
#
# Go requires a build (build-mode: none is unsupported for Go), so it runs a
# minimal `GOWORK=off go build ./...` — the same command CI proves green on
# ubuntu. The committed web/dist/.gitkeep satisfies the `//go:embed all:dist`
# directive, and GOWORK=off ignores the (untracked, local-only) go.work so no
# private engine sibling is needed. TS/JS needs no build (build-mode: none).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2" # Tuesdays 06:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - if: matrix.language == 'go'
        run: GOWORK=off go build ./...
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: "/language:${{ matrix.language }}"
