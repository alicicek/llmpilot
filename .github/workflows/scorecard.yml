name: scorecard

# OpenSSF Scorecard — supply-chain security posture, published for the README
# badge. Weekly + on push to main. Hosted ubuntu (1x, ~2 min); publish uses
# OIDC, so no secret is needed.
#
# Results are published to the OpenSSF API (the badge). We deliberately do NOT
# upload the SARIF to code scanning — that would dump Scorecard's own meta-
# checks (branch-protection, code-review, maintained, ...) into the Security
# tab as permanent "alerts", cluttering it. The code-scanning tab is CodeQL's
# (real code findings); the Scorecard number lives in the badge.

on:
  branch_protection_rule: {}
  schedule:
    - cron: "27 5 * * 1" # Mondays 05:27 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write # publish results for the public badge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
